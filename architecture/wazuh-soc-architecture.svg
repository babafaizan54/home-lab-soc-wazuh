<text x="876" y="727" font-size="18" font-weight="700" fill="#12294a">Assess Activity</text>
<text x="844" y="766" fill="#475569">Benign, suspicious,</text><text x="844" y="786" fill="#475569">or inconclusive</text>
<rect x="1210" y="690" width="350" height="130" rx="10" fill="#fff" stroke="#12294a" stroke-width="2"/>
